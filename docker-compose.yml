version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: hotelpro-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: hotelpro
    volumes:
      - mongo-data:/data/db

  hotelpro-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotelpro-web
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/hotelpro
      - JWT_SECRET=hotelpro_super_secure_production_secret_key_2026_jwt_token
      - JWT_EXPIRES_IN=7d
      - NODE_ENV=production
    depends_on:
      - mongodb

volumes:
  mongo-data:
